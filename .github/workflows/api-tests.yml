name: API tests

on:
  push:
    paths: ["services/api/**"]
  pull_request:
    paths: ["services/api/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        working-directory: services/api
        run: ./mvnw -B clean test
