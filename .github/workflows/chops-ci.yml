# Check the web and API independently against the Node and JDK versions used by contributors.

name: Chops CI


on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: chops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (TypeScript + Vite)
        run: npm run build

      - name: Test inventory and reporting rules
        run: npm test

      - name: Lint frontend
        run: npm run lint

  backend:
    name: Backend - Test and Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests and package backend
        run: ./mvnw -B --no-transfer-progress clean verify
