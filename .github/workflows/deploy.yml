name: Deploy Chops to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      # Informational for now: 7 pre-existing lint errors. Remove
      # continue-on-error once they are fixed so lint blocks the deploy.
      - name: Lint
        continue-on-error: true
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

      # GitHub Pages serves 404.html for direct URLs like /Chops/inventory.
      # React Router then interprets the original path client-side.
      - name: Support direct navigation
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy
        uses: actions/deploy-pages@v4
